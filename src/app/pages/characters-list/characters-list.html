<section>
  <h1>Personnages</h1>

  <div class="toolbar">
    <app-search-bar (search)="onSearch($event)" />

    <select (change)="onStatusChange($event)" [value]="status()">
      <option value="">Tous les statuts</option>
      <option value="alive">Alive</option>
      <option value="dead">Dead</option>
      <option value="unknown">Unknown</option>
    </select>

    <div class="source-toggle">
      <button type="button" [class.active]="source() === 'rest'" (click)="onSourceChange('rest')">
        REST
      </button>
      <button
        type="button"
        [class.active]="source() === 'graphql'"
        (click)="onSourceChange('graphql')"
      >
        GraphQL
      </button>
    </div>
  </div>

  @if (vm$ | async; as vm) {
    @if (vm.loading) {
      <app-loader />
    } @else if (vm.error) {
      <app-error-message [message]="vm.error" (retry)="onSearch(name())" />
    } @else {
      @if (vm.data; as data) {
        <div class="list">
          @for (character of data.results; track character.id) {
            <app-character-card
              [character]="character"
              [isFavori]="favoris.isFavori(character.id)"
              (toggleFavori)="toggleFavori($event)"
            />
          }
        </div>

        <app-paginator
          [currentPage]="page()"
          [totalPages]="data.info.pages"
          (prev)="prev()"
          (next)="next(data.info.pages)"
        />
      }
    }
  }
</section>

<style>
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    align-items: center;
    margin: 1rem 0 1.5rem;
  }
  .toolbar app-search-bar {
    flex: 1;
    min-width: 220px;
  }
  select {
    padding: 0.6rem 0.8rem;
    border: 1px solid #cdd6dd;
    border-radius: 10px;
  }
  .source-toggle button {
    padding: 0.6rem 1rem;
    border: 1px solid #2a9d8f;
    background: #fff;
    color: #2a9d8f;
    cursor: pointer;
  }
  .source-toggle button:first-child {
    border-radius: 8px 0 0 8px;
  }
  .source-toggle button:last-child {
    border-radius: 0 8px 8px 0;
  }
  .source-toggle button.active {
    background: #2a9d8f;
    color: #fff;
  }
</style>
